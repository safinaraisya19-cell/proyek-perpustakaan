<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perpustakaan MVP</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans text-gray-800">

    <!-- Navbar -->
    <nav class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold"><i class="fa-solid fa-book mr-2"></i>PerpusKu</h1>
            <span class="text-sm bg-indigo-700 px-3 py-1 rounded-full">Sistem Peminjaman MVP</span>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- KOLOM KIRI: Katalog Buku (Sesuai Class Buku & Penulis) -->
        <div class="md:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <h2 class="text-lg font-bold text-gray-900 mb-4 border-b pb-2">Katalog Buku</h2>
            
            <!-- List Buku (Dummy Data) -->
            <div class="space-y-4">
                <!-- Buku 1 -->
                <div class="flex items-start p-4 bg-gray-50 border rounded-lg">
                    <div class="bg-indigo-100 text-indigo-600 p-3 rounded-lg mr-4">
                        <i class="fa-solid fa-book-open text-xl"></i>
                    </div>
                    <div class="flex-1">
                        <h3 class="font-bold text-lg">Pemrograman Web Dasar</h3>
                        <p class="text-sm text-gray-500">Penulis: Budi Santoso | Tahun: 2023 | ISBN: 978-123</p>
                        <p class="text-sm text-green-600 font-medium mt-1">Stok Tersedia: 5</p>
                    </div>
                    <button onclick="pilihBuku('Pemrograman Web Dasar')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm transition">
                        Pinjam
                    </button>
                </div>

                <!-- Buku 2 -->
                <div class="flex items-start p-4 bg-gray-50 border rounded-lg">
                    <div class="bg-indigo-100 text-indigo-600 p-3 rounded-lg mr-4">
                        <i class="fa-solid fa-book-open text-xl"></i>
                    </div>
                    <div class="flex-1">
                        <h3 class="font-bold text-lg">Desain UI/UX Modern</h3>
                        <p class="text-sm text-gray-500">Penulis: Siti Aminah | Tahun: 2022 | ISBN: 978-456</p>
                        <p class="text-sm text-green-600 font-medium mt-1">Stok Tersedia: 2</p>
                    </div>
                    <button onclick="pilihBuku('Desain UI/UX Modern')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm transition">
                        Pinjam
                    </button>
                </div>
            </div>
        </div>

        <!-- KOLOM KANAN: Form Peminjaman (Sesuai Class Anggota & Peminjaman) -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 h-fit sticky top-6">
            <h2 class="text-lg font-bold text-gray-900 mb-4 border-b pb-2">Form Peminjaman</h2>
            
            <form id="formPinjam" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nama Anggota</label>
                    <input type="text" id="namaAnggota" required placeholder="Masukkan NIM/Nama" 
                        class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Buku yang Dipinjam</label>
                    <input type="text" id="inputBuku" readonly placeholder="Pilih dari katalog" 
                        class="w-full px-3 py-2 border rounded-lg bg-gray-100 text-sm text-gray-600">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal Pinjam</label>
                    <input type="date" id="tglPinjam" required
                        class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
                
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg font-medium transition mt-4">
                    <i class="fa-solid fa-paper-plane mr-2"></i>Proses Peminjaman
                </button>
            </form>
        </div>
    </main>

    <!-- Vanilla JavaScript -->
    <script>
        // Simulasi interaksi antar class
        const formPinjam = document.getElementById('formPinjam');
        const inputBuku = document.getElementById('inputBuku');

        // Fungsi saat tombol "Pinjam" di katalog diklik
        function pilihBuku(judulBuku) {
            inputBuku.value = judulBuku;
            document.getElementById('namaAnggota').focus(); // Langsung arahkan kursor ke input nama
        }

        // Fungsi saat form disubmit (Proses Peminjaman)
        formPinjam.addEventListener('submit', function(e) {
            e.preventDefault(); // Mencegah halaman reload
            
            const nama = document.getElementById('namaAnggota').value;
            const buku = inputBuku.value;
            const tanggal = document.getElementById('tglPinjam').value;

            // Validasi sederhana
            if(!buku) {
                alert('Silakan pilih buku dari katalog terlebih dahulu!');
                return;
            }

            // Simulasi Alert Sukses
            alert(`✅ BERHASIL DIPROSES!\n\nAnggota: ${nama}\nBuku: ${buku}\nTanggal: ${tanggal}\n\nStatus: Dipinjam.`);
            
            // Reset form
            formPinjam.reset();
            inputBuku.value = "";
        });
    </script>
</body>
</html>
